<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Newgen | IMPACT</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="UI/logo/ng_favicon.ico" rel="icon">
    <!-- custom and library css -->
    <link rel="stylesheet" href="assets/${{VERSION}}$/vendor/vendor_jbt.css?_${{TIMESTAMP}}$">
    <link rel="stylesheet" href="assets/${{VERSION}}$/css/dashboard.css?_${{TIMESTAMP}}$">
    <!-- Combine version of third party -->
    <script src="assets/${{VERSION}}$/vendor/vendor_jbt.js?_${{TIMESTAMP}}$"></script>
    <script src="assets/${{VERSION}}$/vendor/vendor_smt.js?_${{TIMESTAMP}}$"></script>
    <!-- AG-GRID Plugins -->
    <script type="text/javascript" src="assets/${{VERSION}}$/vendor/ag-grid-enterprise.min.js?_${{TIMESTAMP}}$"></script>
    <!-- Page Script -->
    <script type="text/javascript" src="assets/${{VERSION}}$/js/dashboard.js?_${{TIMESTAMP}}$"></script>
    <style>
        .content-wrapper {
            margin-top: calc(1.25rem + 1px) !important;
        }
    </style>
</head>

<body class="hold-transition sidebar-mini layout-navbar-fixed sidebar-collapse">
    <!--07-08-2023-->
    <div id="loader-wrapper" style="visibility: hidden;">
        <div class="loader-section"></div>
        <div class="text-center" style="top: 45%; position: relative; z-index: 9999;">
            <span title="spinner-alt" class="icon-spinner-alt spin"></span>
            <div class="spinner-border" role="status">
                <span class="sr-only">Loading...</span>
            </div>
        </div>
    </div>
    <div class="wrapper">
        <nav class="main-header navbar navbar-expand navbar-white navbar-light toprow">
            <ul class="navbar-nav" style="visibility: hidden;">
                <li class="nav-item d-sm-inline-block"><a href="#" class="nav-link clientlogo" id=""></a> </li>
                <li class="nav-item d-sm-inline-block">
                    <select class="clientselect" onchange="changeClient(this);"></select>
                </li>
                <!-- <li class="nav-item d-sm-inline-block"><a href="#" class="nav-link header" id="">Dashboard</a> </li> -->
            </ul>
            <ul class="navbar-nav ml-auto">
                <!--07-08-2023-->
                <li class="nav-item d-sm-inline-block"><a href="javascript:void(0);" class="nav-link header" id="_subhead">Dashboard</span></a> </li>
            </ul>
            <ul class="navbar-nav ml-auto">
                <li class="nav-item dropdown"><a class="nav-link right" href="javascript:void(0);"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-person-fill" viewBox="0 0 16 16">
                            <path d="M3 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1H3zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6z" /></svg> <span data--toggle="tooltip" data-placement="bottom" id="dash_username">User Name</span></a></li>
                <li class="nav-item dropdown" onclick="log_out_dash()"><a class="nav-link right" href="javascript:void(0);"><img id="userIdLogoDash" src="UI/svg/mainPage/Logout.svg" alt="user" class="mr-1 mt-n1">Log Out</a></li>
            </ul>
        </nav>
        <!-- <aside class="main-sidebar sidebar-light-primary elevation-4"><a href="#" class="brand-link"><img src="UI/svg/logo/IMPACT_5_4.png" alt="Newgen Logo" class="brand-image"></a></aside> -->
        <div class="content-wrapper">
            <section class="content">
                <div class="row">
                    <div class="col-lg-12">
                        <div class="card">
                            <div id="data_div" class="card-body">
                                <div class="d-flex flex-column" id="filter_bth_group">
                                    <span class="filter_fn_bth d-flex" id="filter_btn_div">
                                        <div class="d-flex flex-row">
                                            <div class="dropdown" id="journal_name_div">
                                                <button class="btn dropdown-toggle" type="button" id="journal_list_drop" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">Choose Journals</button>
                                                <div class="dropdown-menu" aria-labelledby="journal_list_drop">
                                                    <form>
                                                        <div class="form-group m-2"><input type="search" class="form-control form-control-sm list-item-search" placeholder="search"></div>
                                                        <div class="form-group d-flex justify-content-center"><input class="btn btn-sm w-75 btn-primary list-item-reset" type="reset" value="Reset"></div>
                                                        <div class="form-group list-items-div"></div>
                                                    </form>
                                                </div>
                                            </div>
                                            <button type="button" id="journal_list_fetch_data" data-value="DASH_BOARD" class="d-none">Get Journals</button>
                                        </div>
                                        <div class="ml-3">
                                            <form class="form-inline"><input type="text" class="form-control" id="direct_search_doi" placeholder="Search DOI (txae000,oyae000)"></form>
                                        </div>
                                        <div class="ml-auto">
                                            <button type="button" data-report="DASH_BOARD" title="" id="over_all">OverAll Report</button>
                                            <button type="button" data-report="DASH_BOARD" title="" id="package_all">Package Status Report</button>
                                            <input type="text" autocomplete="off" data-filter="key" class="searchBox" id="search_input" placeholder="Search" title="Search By">
                                            <button type="button" onclick="FilterMethod(this)" id="reset" data-filter="reset" title="Reset Filter"><i class="fas fa-sync-alt"></i></button>
                                            <button type="button" class="ml-5" onclick="onBtExport(this)" id="export" title="Export to Excel"><i class="fas fa-file-export"></i></button>
                                            <span class="dropdown">
                                                <button type="button" class="dropdown-toggle" data-toggle="dropdown" aria-expanded="false" id="dropdownMenuButtonSett"><i class="fas fa-cogs" title="Settings"></i></button>
                                                <div class="dropdown-menu dropdown-menu-bottom" aria-labelledby="dropdownMenuButtonSett">
                                                    <a class="dropdown-item" href="#" data-type="rowGroup" onclick="resetHeaderOpt(this);">Toggle Row Group</a>
                                                    <a class="dropdown-item" href="#" data-type="sideBarShowHide" onclick="resetHeaderOpt(this);">Toggle SideBar</a>
                                                    <a class="dropdown-item" href="#" data-type="floatfilter" onclick="resetHeaderOpt(this);">Toggle Float Filter</a>
                                                    <a class="dropdown-item" href="#" data-filter="reset" onclick="FilterMethod(this)">Clear Filter</a>
                                                    <a class="dropdown-item" href="#" data-type="auto_resize" onclick="resetHeaderOpt(this,false)">Autosize All Columns</a>
                                                    <a class="dropdown-item" href="#" data-type="column" onclick="resetHeaderOpt(this);">Reset Columns</a>
                                                </div>
                                            </span>
                                        </div>
                                    </span>
                                </div>
                                <div id="myGrid" class="ag-theme-alpine"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>
        <footer class="footer d-flex justify-content-between">
            <div class="logodiv"><img class="navbar-brand im-logo-size" src="UI/svg/logo/IMPACT_5_4.svg" alt="Logo"></div>
            <div class="mr-lg-3 footer-text">Developed and Maintained by <a rel="help" href="https://www.newgen.co" target="_blank"><img alt="load" src="UI/svg/logo/Newgen.svg" class="new-logo mr-1"></a> KnowledgeWorks</div>
        </footer>
        <!-- <aside class="control-sidebar control-sidebar-light"></aside> -->
    </div>
    <div id="loadingid" class="d-none">
        <div class="loader-inner"><span class="top"><img src="UI/img/load1.gif" width="100px;" alt=""></span> <br>Please Wait</div>
    </div>
</body>

</html>
